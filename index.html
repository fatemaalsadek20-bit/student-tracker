<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتاب التلوين الرقمي Interactive Coloring Book</title>
    <style>
        :root {
            --bg: #f9f6f0;
            --panel: #ffffff;
            --accent: #a3b18a;
            --border: #e0d8cc;
            --text: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

        /* القائمة الجانبية */
        .sidebar {
            width: 300px;
            background: var(--panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 10px;
        }
        .sidebar h3 { color: #588157; text-align: center; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        .page-list { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .page-btn {
            padding: 10px 14px;
            border: 1px solid var(--border);
            background: #faf8f5;
            border-radius: 8px;
            cursor: pointer;
            text-align: right;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .page-btn:hover, .page-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        /* منطقة العمل */
        .workspace { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        
        .toolbar {
            position: absolute;
            top: 15px;
            background: var(--panel);
            padding: 8px 20px;
            border-radius: 30px;
            display: flex;
            gap: 12px;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            border: 1px solid var(--border);
        }
        .palette { display: flex; gap: 6px; }
        .color-dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; box-shadow: 0 0 3px rgba(0,0,0,0.3); }
        .color-dot.active { transform: scale(1.15); border-color: #333; }
        .btn { background: #f0eae1; border: none; padding: 6px 12px; border-radius: 15px; cursor: pointer; font-size: 0.85rem; }
        .btn:hover { background: #e2dad0; }

        /* مسرح الرسم والتلوين */
        .canvas-container {
            width: 600px;
            height: 700px;
            background: white;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border-radius: 8px;
        }
        svg.drawing-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* للسماح بالرسم تحته أو فوقه */
            z-index: 2;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            touch-action: none;
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>رسومات التلوين</h3>
        <div class="page-list" id="pageList"></div>
    </div>

    <div class="workspace">
        <div class="toolbar">
            <div class="palette" id="palette"></div>
            <input type="color" id="customColor" value="#a3b18a" style="width:28px; height:28px; border:none; background:none; cursor:pointer;">
            <label style="font-size:0.8rem;">الحجم: <input type="range" id="brushSize" min="3" max="40" value="12"></label>
            <button class="btn" id="eraserBtn">ممحاة</button>
            <button class="btn" id="clearBtn">مسح</button>
            <button class="btn" id="saveBtn">حفظ الصورة</button>
        </div>

        <div class="canvas-container">
            <!-- طبقة تلوين المستخدم -->
            <canvas id="paintCanvas" width="600" height="700"></canvas>
            <!-- طبقة الرسم المتجهي (Line Art SVG) -->
            <svg id="svgOverlay" class="drawing-svg" viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
    </div>

    <script>
        // رسومات SVG حقيقية بدون ملامح ومفرغة للتلوين
        const drawings = [
            {
                title: "1. فتاة تقرأ (بدون ملامح)",
                svg: `
                    <!-- شعر ووجه مفرغ -->
                    <path d="M 220 220 Q 300 120 380 220 Q 390 320 370 360 L 230 360 Q 210 300 220 220 Z" fill="none" stroke="#222" stroke-width="4"/>
                    <path d="M 240 210 Q 300 160 360 210" fill="none" stroke="#222" stroke-width="3"/>
                    <!-- الجسم والملابس -->
                    <path d="M 230 360 L 170 550 L 430 550 L 370 360 Z" fill="none" stroke="#222" stroke-width="4"/>
                    <!-- الكتاب بين اليدين -->
                    <path d="M 230 440 L 300 460 L 370 440 L 370 500 L 300 520 L 230 500 Z" fill="none" stroke="#222" stroke-width="3"/>
                    <line x1="300" y1="460" x2="300" y2="520" stroke="#222" stroke-width="3"/>
                    <!-- اليدين بدون تفاصيل ملامح -->
                    <path d="M 200 420 Q 240 450 260 460" fill="none" stroke="#222" stroke-width="4"/>
                    <path d="M 400 420 Q 360 450 340 460" fill="none" stroke="#222" stroke-width="4"/>
                `
            },
            {
                title: "2. ماندالا الزهرة الهادئة",
                svg: `
                    <g stroke="#222" stroke-width="3" fill="none" transform="translate(300, 350)">
                        <circle cx="0" cy="0" r="40"/>
                        <circle cx="0" cy="0" r="80"/>
                        <circle cx="0" cy="0" r="160"/>
                        <circle cx="0" cy="0" r="230"/>
                        <!-- بتلات ماندالا -->
                        <path d="M 0 -40 Q 30 -60 0 -80 Q -30 -60 0 -40"/>
                        <path d="M 0 40 Q 30 60 0 80 Q -30 60 0 40"/>
                        <path d="M -40 0 Q -60 30 -80 0 Q -60 -30 -40 0"/>
                        <path d="M 40 0 Q 60 30 80 0 Q 60 -30 40 0"/>
                        <!-- البتلات الخارجية -->
                        <path d="M 0 -80 Q 60 -120 0 -160 Q -60 -120 0 -80"/>
                        <path d="M 0 80 Q 60 120 0 160 Q -60 120 0 80"/>
                        <path d="M -80 0 Q -120 60 -160 0 Q -120 -60 -80 0"/>
                        <path d="M 80 0 Q 120 60 160 0 Q 120 -60 80 0"/>
                    </g>
                `
            },
            {
                title: "3. قطة نائمة على النافذة (مفرغة الملامح)",
                svg: `
                    <!-- النافذة -->
                    <rect x="120" y="80" width="360" height="520" fill="none" stroke="#222" stroke-width="4" rx="10"/>
                    <line x1="300" y1="80" x2="300" y2="600" stroke="#222" stroke-width="3"/>
                    <line x1="120" y1="300" x2="480" y2="300" stroke="#222" stroke-width="3"/>
                    <!-- جسم القطة المفرغ -->
                    <ellipse cx="300" cy="540" rx="90" ry="45" fill="none" stroke="#222" stroke-width="4"/>
                    <!-- رأس القطة مع أذنين بدون عينين أو أنف -->
                    <path d="M 220 520 C 210 470 240 450 260 470 L 250 430 L 280 450 C 300 440 310 460 310 480" fill="none" stroke="#222" stroke-width="4"/>
                    <!-- الذيل -->
                    <path d="M 390 540 Q 440 530 430 490 Q 410 470 410 500" fill="none" stroke="#222" stroke-width="4"/>
                `
            },
            {
                title: "4. مزهرية وأوراق شجر استوائية",
                svg: `
                    <!-- المزهرية -->
                    <path d="M 230 400 Q 200 520 240 600 L 360 600 Q 400 520 370 400 Z" fill="none" stroke="#222" stroke-width="4"/>
                    <!-- أوراق الشجر -->
                    <path d="M 300 400 Q 250 250 150 220 Q 260 280 300 400" fill="none" stroke="#222" stroke-width="3"/>
                    <path d="M 300 400 Q 350 200 450 150 Q 380 250 300 400" fill="none" stroke="#222" stroke-width="3"/>
                    <path d="M 300 400 Q 300 150 300 80 Q 330 200 300 400" fill="none" stroke="#222" stroke-width="3"/>
                    <!-- عروق الأوراق -->
                    <line x1="300" y1="400" x2="200" y2="240" stroke="#222" stroke-width="2"/>
                    <line x1="300" y1="400" x2="400" y2="180" stroke="#222" stroke-width="2"/>
                `
            },
            {
                title: "5. عبارة مخطوطة: (وَتَطْمَئِنُّ قُلُوبُهُم)",
                svg: `
                    <!-- إطار مزخرف -->
                    <rect x="70" y="150" width="460" height="400" fill="none" stroke="#222" stroke-width="4" rx="20"/>
                    <rect x="90" y="170" width="420" height="360" fill="none" stroke="#222" stroke-width="2" rx="15"/>
                    <!-- النص مفرغ للتلوين -->
                    <text x="300" y="360" font-size="42" font-family="serif" text-anchor="middle" fill="none" stroke="#222" stroke-width="3" letter-spacing="3">
                        وَتَطْمَئِنُّ قُلُوبُهُم
                    </text>
                `
            }
        ];

        // الألوان الناعمة للتلوين
        const colors = ["#d8e2dc", "#ffe5ec", "#ffcad4", "#f4acb7", "#9cb09d", "#6b7c6c", "#b8bedd", "#fefae0", "#d4a373", "#000000"];

        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        const svgOverlay = document.getElementById('svgOverlay');
        const pageList = document.getElementById('pageList');
        const palette = document.getElementById('palette');
        const brushSize = document.getElementById('brushSize');

        let isDrawing = false;
        let currentColor = colors[4];
        let isEraser = false;

        // تحميل قائمة الصور
        drawings.forEach((item, index) => {
            const btn = document.createElement('div');
            btn.className = `page-btn ${index === 0 ? 'active' : ''}`;
            btn.textContent = item.title;
            btn.onclick = () => loadDrawing(index);
            pageList.appendChild(btn);
        });

        // تحميل أزرار الألوان
        colors.forEach((color, i) => {
            const dot = document.createElement('div');
            dot.className = `color-dot ${i === 4 ? 'active' : ''}`;
            dot.style.background = color;
            dot.onclick = () => {
                document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                currentColor = color;
                isEraser = false;
            };
            palette.appendChild(dot);
        });

        document.getElementById('customColor').oninput = (e) => {
            currentColor = e.target.value;
            isEraser = false;
        };

        function loadDrawing(index) {
            document.querySelectorAll('.page-btn').forEach((b, i) => b.classList.toggle('active', i === index));
            svgOverlay.innerHTML = drawings[index].svg;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // أجهزة اللمس والماوس
        const getPos = (e) => {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        };

        const start = (e) => { isDrawing = true; draw(e); };
        const stop = () => { isDrawing = false; ctx.beginPath(); };
        const draw = (e) => {
            if (!isDrawing) return;
            const pos = getPos(e);
            ctx.lineWidth = brushSize.value;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (isEraser) {
                ctx.globalCompositeOperation = 'destination-out';
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = currentColor;
            }

            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        };

        canvas.addEventListener('mousedown', start);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stop);
        canvas.addEventListener('mouseleave', stop);

        canvas.addEventListener('touchstart', (e) => { start(e); e.preventDefault(); });
        canvas.addEventListener('touchmove', (e) => { draw(e); e.preventDefault(); });
        canvas.addEventListener('touchend', stop);

        document.getElementById('eraserBtn').onclick = () => isEraser = true;
        document.getElementById('clearBtn').onclick = () => ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // حفظ الصورة النهائية مطبقة
        document.getElementById('saveBtn').onclick = () => {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tempCtx = tempCanvas.getContext('2d');
            
            // خلفية بيضاء
            tempCtx.fillStyle = '#ffffff';
            tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
            // رسم التلوين
            tempCtx.drawImage(canvas, 0, 0);
            
            // دمج رسمة الخطوط SVG فوق التلوين
            const xml = new XMLSerializer().serializeToString(svgOverlay);
            const svgImg = new Image();
            svgImg.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(xml)));
            svgImg.onload = () => {
                tempCtx.drawImage(svgImg, 0, 0);
                const a = document.createElement('a');
                a.download = 'colored-page.png';
                a.href = tempCanvas.toDataURL();
                a.click();
            };
        };

        // تشغيل الصفحة الأولى
        loadDrawing(0);
    </script>
</body>
</html>
