<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتاب التلوين الرقمي | مساحة الهدوء والإبداع</title>
    <style>
        :root {
            --bg-color: #f4ece1;
            --panel-bg: #ffffff;
            --accent-color: #9cb09d;
            --text-color: #4a4a4a;
            --border-color: #e0d7cb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Directory */
        .sidebar {
            width: 320px;
            background: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
        }

        .sidebar h2 {
            font-size: 1.2rem;
            color: #6b7c6c;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--bg-color);
        }

        .pages-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-left: 5px;
        }

        .page-item {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #faf8f5;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .page-item:hover, .page-item.active {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        /* Main Workspace */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .canvas-container {
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }

        canvas {
            touch-action: none;
            cursor: crosshair;
        }

        /* Toolbar Header */
        .toolbar {
            position: absolute;
            top: 20px;
            background: var(--panel-bg);
            padding: 10px 25px;
            border-radius: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .color-palette {
            display: flex;
            gap: 8px;
        }

        .color-btn {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            border: 2px solid white;
            cursor: pointer;
            box-shadow: 0 0 4px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        .color-btn:hover, .color-btn.active {
            transform: scale(1.2);
        }

        .tool-btn {
            background: #f0eae1;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-color);
            transition: background 0.2s;
        }

        .tool-btn:hover {
            background: #e2dad0;
        }

        .size-picker {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
        }

        /* Responsive Layout */
        @media (max-width: 900px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 180px; }
            .toolbar { position: static; margin-bottom: 10px; }
        }
    </style>
</head>
<body>

    <!-- Sidebar with 30 Prompts -->
    <div class="sidebar">
        <h2>صفحات التلوين (30 فكرة)</h2>
        <div class="pages-list" id="pagesList"></div>
    </div>

    <!-- Canvas & Tools Area -->
    <div class="main-content">
        <div class="toolbar">
            <div class="color-palette" id="palette"></div>
            <input type="color" id="customColor" value="#9cb09d" style="width:30px; height:30px; border:none; cursor:pointer; background:none;">
            <div class="size-picker">
                <span>الحجم:</span>
                <input type="range" id="brushSize" min="2" max="30" value="8">
            </div>
            <button class="tool-btn" id="eraserBtn">ممحاة</button>
            <button class="tool-btn" id="clearBtn">مسح الكل</button>
            <button class="tool-btn" id="saveBtn">حفظ الصورة</button>
        </div>

        <div class="canvas-container">
            <canvas id="paintCanvas" width="650" height="750"></canvas>
        </div>
    </div>

    <script>
        // 30 Creative Theme Titles without facial features
        const pages = [
            "1. ماندالا الهدوء والسكينة",
            "2. فتاة تقرأ كتاب تحت الشجرة (بدون ملامح)",
            "3. غابة الصنوبر والغيوم الناعمة",
            "4. عبارة خط عربي: 'وَتَطْمَئِنُّ قُلُوبُهُم'",
            "5. فنجان قهوة دافئ وأوراق خريفية",
            "6. قطة مستلقية على النافذة (بدون ملامح)",
            "7. بستان زهور اللافندر والبابونج",
            "8. تصميم هندسي إسلامي مكرر",
            "9. عبارة خط عربي: 'يُدَبِّرُ الْأَمْرَ'",
            "10. منظر جبال وطرق متعرجة",
            "11. شخص يتأمل السماء والنجوم (بدون ملامح)",
            "12. مزهرية عتيقة ونباتات ظلية",
            "13. ماندالا دائري كلاسيكي",
            "14. طائر يتنقل بين الأغصان (ظلي بدون تفاصيل دقيقة)",
            "15. عبارة خط عربي: 'وَاصْبِرْ لِحُكْمِ رَبِّكَ'",
            "16. بيت ريفي قديم وسط الحقول",
            "17. أشكال متموجة للتفريغ النفسي",
            "18. أيادي تحمل شتلة صغيرة (بدون ملامح)",
            "19. تجميعة صدف وأمواج بحرية",
            "20. عبارة خط عربي: 'فَإِنَّ مَعَ الْعُسْرِ يُسْرًا'",
            "21. منارة على شاطئ البحر",
            "22. دراجة كلاسيكية بسلة زهور",
            "23. غرف منزلية بتصميم دافئ",
            "24. نمط ماندالا زهرة اللوتس",
            "25. عبارة خط عربي: 'سَيَجْعَلُ اللَّهُ بَعْدَ عُسْرٍ يُسْرًا'",
            "26. فتاة في حقل عباد الشمس (ظلية بدون ملامح)",
            "27. فراشات وأشكال هندسية متداخلة",
            "28. كوكب وأوراق شجر سريالية",
            "29. مكتبة مليئة بالكتب والوسائد",
            "30. عبارة خط عربي: 'سَلاَمٌ هِيَ حَتَّى مَطْلَعِ الْفَجْرِ'"
        ];

        // Soft Color Palette
        const colors = [
            "#000000", "#6b7c6c", "#9cb09d", "#c5d3c6", 
            "#d4a373", "#e9edc9", "#fefae0", "#faedcd", 
            "#e8aeb7", "#b8bedd", "#d8e2dc", "#ffe5ec"
        ];

        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        const pagesList = document.getElementById('pagesList');
        const palette = document.getElementById('palette');
        const brushSize = document.getElementById('brushSize');
        const customColor = document.getElementById('customColor');

        let isDrawing = false;
        let currentColor = '#9cb09d';
        let isEraser = false;
        let currentPageIndex = 0;

        // Render Page Titles
        pages.forEach((pageTitle, index) => {
            const item = document.createElement('div');
            item.className = `page-item ${index === 0 ? 'active' : ''}`;
            item.textContent = pageTitle;
            item.onclick = () => loadPage(index);
            pagesList.appendChild(item);
        });

        // Render Color Palette
        colors.forEach(color => {
            const btn = document.createElement('div');
            btn.className = 'color-btn';
            btn.style.backgroundColor = color;
            btn.onclick = () => {
                currentColor = color;
                isEraser = false;
            };
            palette.appendChild(btn);
        });

        customColor.oninput = (e) => {
            currentColor = e.target.value;
            isEraser = false;
        };

        // Draw Line Art Templates dynamically
        function loadPage(index) {
            currentPageIndex = index;
            document.querySelectorAll('.page-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Basic Dynamic Line-art outline generator based on page theme
            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 2;
            ctx.beginPath();

            // Geometric & Vector Shapes (Clean outline drawings for coloring)
            if (index % 4 === 0) { // Mandalas
                for (let i = 0; i < 8; i++) {
                    ctx.arc(325, 375, (i + 1) * 35, 0, Math.PI * 2);
                }
            } else if (index % 4 === 1) { // Calligraphy / Text Box Outline
                ctx.rect(100, 250, 450, 250);
                ctx.stroke();
                ctx.font = '30px Cairo, sans-serif';
                ctx.fillStyle = '#333';
                ctx.textAlign = 'center';
                ctx.fillText(pages[index].split(':')[1] || pages[index], 325, 385);
            } else if (index % 4 === 2) { // Nature elements
                ctx.arc(325, 300, 150, 0, Math.PI * 2);
                ctx.rect(150, 450, 350, 200);
            } else { // Faceless silhouettes
                ctx.arc(325, 250, 70, 0, Math.PI * 2); // Head without features
                ctx.rect(225, 320, 200, 300); // Body outline
            }
            ctx.stroke();
        }

        // Canvas Interaction Setup
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        // Touch support for iPad/Tablets
        canvas.addEventListener('touchstart', (e) => { startDrawing(e.touches[0]); e.preventDefault(); });
        canvas.addEventListener('touchmove', (e) => { draw(e.touches[0]); e.preventDefault(); });
        canvas.addEventListener('touchend', stopDrawing);

        function startDrawing(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        function draw(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.strokeStyle = isEraser ? '#ffffff' : currentColor;
            ctx.lineWidth = brushSize.value;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        function stopDrawing() {
            isDrawing = false;
        }

        document.getElementById('eraserBtn').onclick = () => isEraser = true;
        document.getElementById('clearBtn').onclick = () => loadPage(currentPageIndex);
        document.getElementById('saveBtn').onclick = () => {
            const link = document.createElement('a');
            link.download = `coloring-page-${currentPageIndex + 1}.png`;
            link.href = canvas.toDataURL();
            link.click();
        };

        // Initialize First Page
        loadPage(0);
    </script>
</body>
</html>
