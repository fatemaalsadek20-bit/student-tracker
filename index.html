<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظم الطالب الذكي 2027 | Smart Student Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-purple: #c084fc;
            --text-title: #f8fafc;
            --text-body: #cbd5e1;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-title);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 2rem 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--accent-blue);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-body);
            font-size: 1.2rem;
        }

        /* Layout Grid */
        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 1.4rem;
            color: var(--accent-blue);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Pomodoro Timer */
        .timer-box {
            text-align: center;
        }

        .timer-display {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--accent-purple);
            margin: 1rem 0;
        }

        .btn {
            background-color: var(--accent-blue);
            color: #0f172a;
            border: none;
            padding: 0.7rem 1.5rem;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s ease;
            margin: 0 0.2rem;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-danger {
            background-color: #f87171;
            color: #fff;
        }

        /* Interactive Inputs & Lists */
        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.8rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-main);
            color: #fff;
            font-size: 1rem;
        }

        .item-list {
            list-style: none;
        }

        .item-list li {
            background-color: var(--bg-main);
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
        }

        .item-list li.done {
            text-decoration: line-through;
            opacity: 0.5;
        }

        /* Habit Tracker Checkboxes */
        .habit-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.6rem 0;
            border-bottom: 1px dashed var(--border-color);
            font-size: 1.1rem;
        }

        .habit-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--accent-green);
            cursor: pointer;
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-body);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>منظم الطالب الذكي 2027</h1>
            <p>مساحتك التفاعلية لإدارة المذاكرة، المهام، والعادات اليومية</p>
        </header>

        <div class="grid-layout">
            
            <!-- 1. Pomodoro Focus Timer -->
            <div class="card timer-box">
                <div class="card-title">⏱️ مؤقت التركيز (البومودورو)</div>
                <div class="timer-display" id="timer">25:00</div>
                <div>
                    <button class="btn" onclick="startTimer()">بدء الجلسة</button>
                    <button class="btn btn-danger" onclick="resetTimer()">إعادة ضبط</button>
                </div>
            </div>

            <!-- 2. Habits Tracker -->
            <div class="card">
                <div class="card-title">🌱 متتبع العادات اليومية</div>
                <div class="habit-item">
                    <input type="checkbox" id="h1">
                    <label for="h1">المراجعة اليومية (20 دقيقة لكل مادة)</label>
                </div>
                <div class="habit-item">
                    <input type="checkbox" id="h2">
                    <label for="h2">حل الواجبات أولاً بأول</label>
                </div>
                <div class="habit-item">
                    <input type="checkbox" id="h3">
                    <label for="h3">شرب 2 لتر ماء</label>
                </div>
                <div class="habit-item">
                    <input type="checkbox" id="h4">
                    <label for="h4">نوم منتظم (7-8 ساعات)</label>
                </div>
            </div>

            <!-- 3. Tasks & Assignments Tracker -->
            <div class="card">
                <div class="card-title">📝 جدول المهام والواجبات</div>
                <div class="input-group">
                    <input type="text" id="taskInput" placeholder="أضف واجبًا أو مهمة دراسية...">
                    <button class="btn" onclick="addTask()">إضافة</button>
                </div>
                <ul class="item-list" id="taskList"></ul>
            </div>

            <!-- 4. Term Goals -->
            <div class="card">
                <div class="card-title">🎯 أهداف الفصل الدراسي</div>
                <div class="input-group">
                    <input type="text" id="goalInput" placeholder="أضف هدفًا دراسيًا جديدًا...">
                    <button class="btn" onclick="addGoal()">إضافة</button>
                </div>
                <ul class="item-list" id="goalList"></ul>
            </div>

        </div>

        <footer>
            جميع الحقوق محفوظة © دليل الطالب التفاعلي 2027
        </footer>
    </div>

    <script>
        // Pomodoro Logic
        let timerInterval;
        let timeLeft = 25 * 60;

        function updateTimer() {
            let min = Math.floor(timeLeft / 60);
            let sec = timeLeft % 60;
            document.getElementById('timer').innerText = 
                `${min < 10 ? '0' : ''}${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimer();
                } else {
                    clearInterval(timerInterval);
                    alert("انتهت جلسة التركيز! خذ استراحة لمدة 5 دقائق.");
                }
            }, 1000);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timeLeft = 25 * 60;
            updateTimer();
        }

        // Add Task Logic
        function addTask() {
            let input = document.getElementById('taskInput');
            let text = input.value.trim();
            if(!text) return;

            let li = document.createElement('li');
            li.innerHTML = `
                <span onclick="this.parentElement.classList.toggle('done')" style="cursor:pointer">${text}</span>
                <button class="btn btn-danger" style="padding:0.2rem 0.5rem; font-size:0.8rem;" onclick="this.parentElement.remove()">حذف</button>
            `;
            document.getElementById('taskList').appendChild(li);
            input.value = '';
        }

        // Add Goal Logic
        function addGoal() {
            let input = document.getElementById('goalInput');
            let text = input.value.trim();
            if(!text) return;

            let li = document.createElement('li');
            li.innerHTML = `
                <span onclick="this.parentElement.classList.toggle('done')" style="cursor:pointer">🎯 ${text}</span>
                <button class="btn btn-danger" style="padding:0.2rem 0.5rem; font-size:0.8rem;" onclick="this.parentElement.remove()">حذف</button>
            `;
            document.getElementById('goalList').appendChild(li);
            input.value = '';
        }
    </script>
</body>
</html>
